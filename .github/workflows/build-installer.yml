name: Build Clear Silence macOS installer

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - '.github/workflows/build-installer.yml'
      - 'app.py'
      - 'audio.py'
      - 'silence_math.py'
      - 'ui.html'
      - 'ClearSilenceBridge/**'
      - 'tests/**'
  workflow_dispatch:
  # Repeat a failed macOS runner allocation without manual intervention.
  # Release-check below stops retries once v0.7.3 is published.
  schedule:
    - cron: '23 1,7,13,19 * * *'

permissions:
  contents: write

# Keep only the latest build for this branch. Prevent a queue of stale packages
# when source files are committed separately.
concurrency:
  group: clear-silence-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Check Python sources and tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      published: ${{ steps.release_check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Stop scheduled retries after installer is released
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && gh release view 'v0.7.3-group-tracks' >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            echo 'v0.7.3 already published; macOS job is no longer needed.'
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and unit tests
        run: |
          python -m compileall -q app.py audio.py silence_math.py ClearSilenceBridge packaging tests
          python -m unittest discover -s tests -v
          PYTHONPATH=packaging python -m unittest discover -s packaging/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check interface and capture preview
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-check" playwright@1.58.2
          UI_BROWSER_CHANNEL=chrome NODE_PATH="$RUNNER_TEMP/ui-check/node_modules" UI_OUTPUT="$RUNNER_TEMP" node tests/check_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Clear-Silence-interface
          path: ${{ runner.temp }}/clear-silence-ui*.png

  pkg-arm64:
    # Build on an Apple Silicon runner; use the macOS 15 pool while the
    # macOS 26 pool is not allocating runners for this release.
    needs: source-tests
    if: needs.source-tests.outputs.published != 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pyinstaller>=6.10,<7' 'pywebview>=5,<7' 'pyobjc-framework-WebKit>=10,<13'
      - name: Build native app and PKG
        run: bash packaging/build_installer.sh
      - name: Upload PKG to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Clear-Silence-v0.7.3-group-tracks-macOS-Apple-Silicon
          path: |
            package-output/*.pkg
            package-output/*.sha256
          if-no-files-found: error
      - name: Publish downloadable installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.7.3-group-tracks'
          PKG='package-output/Clear_Silence_0.7.3_macOS_Apple_Silicon.pkg'
          SUM="${PKG}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG" "$SUM" --clobber
          else
            gh release create "$TAG" "$PKG" "$SUM" \
              --target "$GITHUB_SHA" \
              --title 'Clear Silence v0.7.3 — Fix grouped track listing' \
              --notes-file RELEASE_NOTES.md
          fi

name: Build Clear Silence macOS installer

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - '.github/workflows/build-installer.yml'
      - 'app.py'
      - 'audio.py'
      - 'ui.html'
      - 'ClearSilenceBridge/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkg-arm64:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pyinstaller>=6.10,<7' 'pywebview>=5,<7' 'pyobjc-framework-WebKit>=10,<13'
      - name: Build native app and PKG
        run: bash packaging/build_installer.sh
      - name: Upload PKG to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Clear-Silence-v0.4.0-macOS-Apple-Silicon
          path: |
            package-output/*.pkg
            package-output/*.sha256
          if-no-files-found: error
      - name: Publish downloadable installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.4.0-installer'
          PKG='package-output/Clear_Silence_0.4.0_macOS_Apple_Silicon.pkg'
          SUM="${PKG}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG" "$SUM" --clobber
          else
            gh release create "$TAG" "$PKG" "$SUM" \
              --target "$GITHUB_SHA" \
              --title 'Clear Silence v0.4.0 — Compact UI' \
              --notes 'Compact macOS interface, auto-selected audio track, all/custom track modes, preview, new waveform icon. No change to the WAV slicing algorithm. The app updates ClearSilenceBridge on first launch; restart Live after that update. Unsigned and unnotarized; use on a copy of the Live Set.'
          fi

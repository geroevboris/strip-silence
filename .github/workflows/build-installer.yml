name: Build Clear Silence macOS installer

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - '.github/workflows/build-installer.yml'
      - 'app.py'
      - 'native_automation.py'
      - 'audio.py'
      - 'silence_math.py'
      - 'ui.html'
      - 'ClearSilenceBridge/**'
      - 'tests/**'
  workflow_dispatch:
  # Repeat a failed macOS runner allocation without manual intervention.
  # Release-check below stops retries once v0.6.0 is published.
  schedule:
    - cron: '23 1,7,13,19 * * *'

permissions:
  contents: write

# Keep only the latest build for this branch. Prevent a queue of stale packages
# when source files are committed separately.
concurrency:
  group: clear-silence-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Check Python sources and tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      published: ${{ steps.release_check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Stop scheduled retries after installer is released
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && gh release view 'v0.6.0-auto-strip' >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            echo 'v0.6.0 already published; macOS job is no longer needed.'
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and unit tests
        run: |
          python -m compileall -q app.py audio.py silence_math.py native_automation.py ClearSilenceBridge packaging tests
          python -m unittest discover -s tests -v
          PYTHONPATH=packaging python -m unittest discover -s packaging/tests -v

  pkg-arm64:
    # The macos-15 arm64 pool has lately cancelled queued jobs without
    # allocating a runner. Try the distinct, officially supported macOS 26
    # Apple Silicon pool while keeping the release architecture arm64.
    needs: source-tests
    if: needs.source-tests.outputs.published != 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pyinstaller>=6.10,<7' 'pywebview>=5,<7' 'pyobjc-framework-WebKit>=10,<13'
      - name: Validate macOS AppleScript syntax
        run: |
          python - <<'PY'
          import native_automation
          import subprocess
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as d:
              source=Path(d)/'native.applescript'
              compiled=Path(d)/'native.scpt'
              source.write_text(native_automation.APPLESCRIPT, encoding='utf-8')
              subprocess.run(['/usr/bin/osacompile','-o',str(compiled),str(source)],check=True)
          PY
      - name: Build native app and PKG
        run: bash packaging/build_installer.sh
      - name: Upload PKG to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Clear-Silence-v0.6.0-auto-strip-macOS-Apple-Silicon
          path: |
            package-output/*.pkg
            package-output/*.sha256
          if-no-files-found: error
      - name: Publish downloadable installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.6.0-auto-strip'
          PKG='package-output/Clear_Silence_0.6.0_macOS_Apple_Silicon.pkg'
          SUM="${PKG}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG" "$SUM" --clobber
          else
            gh release create "$TAG" "$PKG" "$SUM" \
              --target "$GITHUB_SHA" \
              --title 'Clear Silence v0.6.0 probe — automatic Arrangement split' \
              --notes 'First full automatic Strip Silence beta: user selects audio tracks and strength, app analyzes all quiet regions, sends native Ableton Cmd+E at every computed boundary, verifies all region boundaries in Live and mutes only silence. Original WAV preserved. Requires macOS Accessibility permission. GUI focus across multiple consecutive cuts must be validated on target Live 12.4.6, test on a copy of the Set. Unsigned and unnotarized.'
          fi

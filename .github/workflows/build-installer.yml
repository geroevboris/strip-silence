name: Build Clear Silence macOS installer

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - '.github/workflows/build-installer.yml'
      - 'app.py'
      - 'audio.py'
      - 'silence_math.py'
      - 'ui.html'
      - 'ClearSilenceBridge/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

# Keep only the latest build for this branch. Prevent a queue of stale packages
# when source files are committed separately.
concurrency:
  group: clear-silence-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Check Python sources and tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and unit tests
        run: |
          python -m compileall -q app.py audio.py silence_math.py ClearSilenceBridge packaging tests
          python -m unittest discover -s tests -v
          PYTHONPATH=packaging python -m unittest discover -s packaging/tests -v

  pkg-arm64:
    # The macos-15 arm64 pool has lately cancelled queued jobs without
    # allocating a runner. Try the distinct, officially supported macOS 26
    # Apple Silicon pool while keeping the release architecture arm64.
    needs: source-tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pyinstaller>=6.10,<7' 'pywebview>=5,<7' 'pyobjc-framework-WebKit>=10,<13'
      - name: Build native app and PKG
        run: bash packaging/build_installer.sh
      - name: Upload PKG to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Clear-Silence-v0.5.2-probe-macOS-Apple-Silicon
          path: |
            package-output/*.pkg
            package-output/*.sha256
          if-no-files-found: error
      - name: Publish downloadable installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.5.2-probe'
          PKG='package-output/Clear_Silence_0.5.2_macOS_Apple_Silicon.pkg'
          SUM="${PKG}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG" "$SUM" --clobber
          else
            gh release create "$TAG" "$PKG" "$SUM" \
              --target "$GITHUB_SHA" \
              --title 'Clear Silence v0.5.2 probe — safe compatibility test' \
              --notes 'Safe compatibility probe only: experiments with region trimming on a temporary muted track, records actual Live start/end markers, and removes the temporary track. Bulk Split + Mute is DISABLED until compatibility has been established on the target Ableton Live installation. No WAV file is altered. Unsigned and unnotarized.'
          fi

name: Import Clear Silence source

on:
  push:
    paths:
      - clear-silence-v0.2-src.tar.xz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand archived v0.2 source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf clear-silence-v0.2-src.tar.xz
          chmod +x 01_INSTALL.command 02_START.command "Clear Silence.app/Contents/MacOS/ClearSilenceLauncher"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_INSTALL.command 02_START.command "Clear Silence.app" ClearSilenceBridge README_RU.md app.py audio.py ui.html tests
          if ! git diff --cached --quiet; then
            git commit -m "Import Clear Silence v0.2 source files"
            git push
          fi

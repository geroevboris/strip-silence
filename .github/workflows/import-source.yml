name: Import Clear Silence v0.2 source
on:
  push:
    paths:
      - clear-silence-v0.2-src.tar.xz
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand Clear Silence v0.2
        run: |
          set -euo pipefail
          echo 'edc26303e3fd27367b6763c7dd4be10e06fa27b0edd2e0b17a2289a755415c8d  clear-silence-v0.2-src.tar.xz' | sha256sum -c -
          tar -xJf clear-silence-v0.2-src.tar.xz
          chmod +x 01_INSTALL.command 02_START.command "Clear Silence.app/Contents/MacOS/ClearSilenceLauncher"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_INSTALL.command 02_START.command "Clear Silence.app" ClearSilenceBridge README_RU.md app.py audio.py ui.html tests
          if ! git diff --cached --quiet; then
            git commit -m "Import complete Clear Silence v0.2 source"
            git push
          fi

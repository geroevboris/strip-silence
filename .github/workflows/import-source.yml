name: Import Clear Silence v0.2 sources
on:
  push:
    paths:
      - .import/READY
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source files
        shell: bash
        run: |
          set -euo pipefail
          cat .import/part-*.txt | base64 -d > /tmp/clear-silence-v0.2.tar.xz
          echo 'edc26303e3fd27367b6763c7dd4be10e06fa27b0edd2e0b17a2289a755415c8d  /tmp/clear-silence-v0.2.tar.xz' | sha256sum -c -
          tar -xJf /tmp/clear-silence-v0.2.tar.xz
          chmod +x 01_INSTALL.command 02_START.command "Clear Silence.app/Contents/MacOS/ClearSilenceLauncher"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -r .import
          git commit -m "Import complete Clear Silence v0.2 source"
          git push

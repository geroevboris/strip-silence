</style></head><body>
<header class="title"><span class="symbol" aria-hidden="true"><svg width="25" height="22" viewBox="0 0 25 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M2 9v4M6 5v12M10 8v6M16 5v12M20 2v18M24 8v6"/></svg></span><span><strong>Clear Silence</strong><small>Очистка пауз · v0.7.3</small></span><span id="status">Подключение…</span></header>
<section class="card"><div class="hrow"><span class="label">ОБЛАСТЬ</span><button class="refresh" onclick="refresh()" title="Обновить проект" aria-label="Обновить проект">↻</button></div><div class="toggle"><button data-mode="current" onclick="setMode('current')">Дорожка</button><button data-mode="all" onclick="setMode('all')">Все</button><button data-mode="custom" onclick="setMode('custom')">Выбрать…</button></div><div class="scope" id="scopeLabel">Читаю Arrangement…</div><div id="customPanel"></div></section>
<section class="card"><div class="hrow"><span class="label">ПРЕДПРОСМОТР</span><div class="zoom" role="group" aria-label="Масштаб волны"><button id="zoomOut" onclick="zoomWave(.5)" title="Уменьшить" aria-label="Уменьшить волну" disabled>−</button><output id="zoomLevel" aria-label="Масштаб">1×</output><button id="zoomIn" onclick="zoomWave(2)" title="Увеличить" aria-label="Увеличить волну" disabled>+</button><button id="zoomFit" onclick="fitWave()" title="Показать клип целиком" disabled>Весь</button></div></div><select id="clipPick" aria-label="Клип для просмотра" onchange="previewClip()"><option>Поиск клипов…</option></select><div class="wave"><canvas id="waveform" tabindex="0" role="img" aria-label="Янтарным — остаётся, коралловой штриховкой — вырезается" title="+ / − — масштаб · перетаскивание — перемещение · двойной щелчок — весь клип"></canvas><canvas id="overview" tabindex="0" role="slider" aria-label="Положение видимого участка клипа" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" title="Обзор клипа: щёлкни или перетащи рамку. Стрелки — перемещение."></canvas></div><div class="legend"><span><i class="swatch"></i>Остаётся</span><span><i class="swatch cut"></i>Вырезается</span></div><div id="metrics">Выбери клип</div></section>

<div class="foot"><span>WAV · Warp OFF · Live 12.4.6</span><button class="link" onclick="quitApp()">Закрыть</button></div>
<script>
const $=id=>document.getElementById(id);
let activeJob=null,tracks=[],mode='auto',selectedTrackIndex=null,customIndices=new Set(),initialized=false,running=false,bridgeReady=false,previewData=null,revision=0,job=null;
const settings=()=>{const t=Number($('strength').value)/100;return{strength:Number($('strength').value),threshold:Math.round((-62+37*t)*100)/100,min_silence_ms:Math.round(320-230*t),padding_ms:Math.round(75-60*t)}};
async function api(path,payload){const cfg=payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-ClearSilence-Token':'__CSRF__'},body:JSON.stringify(payload)};const res=await fetch(path,cfg);const data=await res.json();if(!data.ok)throw new Error(data.error||'Ошибка подключения');return data}
function ids(){if(mode==='all')return tracks.map(x=>x.index);if(mode==='current')return tracks.some(x=>x.index===selectedTrackIndex)?[selectedTrackIndex]:[];return tracks.filter(x=>customIndices.has(x.index)).map(x=>x.index)}
function updateScope(){document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));$('customPanel').classList.toggle('open',mode==='custom');const selected=ids(),matches=tracks.filter(x=>selected.includes(x.index)),total=matches.reduce((sum,x)=>sum+x.clips.length,0);const label=$('scopeLabel');label.classList.toggle('warn',!total);if(mode==='current')label.textContent=matches.length?`${matches[0].name} · ${total} клип.`:'Выбери аудиодорожку в Ableton';else label.textContent=`${selected.length} дор. · ${total} аудиоклип.`;$('probe').disabled=!bridgeReady||!selected.length||running;$('cancel').style.display=running?'block':'none';document.querySelectorAll('select,input,[data-mode],.refresh').forEach(el=>el.disabled=running)}
function drawTracks(){const root=$('customPanel');root.replaceChildren();for(const tr of tracks){const lab=document.createElement('label');lab.className='track';const cb=document.createElement('input');cb.type='checkbox';cb.checked=customIndices.has(tr.index);cb.onchange=()=>{cb.checked?customIndices.add(tr.index):customIndices.delete(tr.index);updateScope();drawPicker()};const sp=document.createElement('span');sp.textContent=tr.name;const note=document.createElement('small');note.textContent=tr.clips.length+' кл.';lab.append(cb,sp,note);root.appendChild(lab)}}
function setMode(v){if(running)return;mode=v;updateScope();drawPicker()}
function drawPicker(){const pick=$('clipPick'),previous=pick.value;pick.replaceChildren();for(const tr of tracks){if(!ids().includes(tr.index))continue;for(const clip of tr.clips){const option=document.createElement('option');option.value=tr.index+':'+clip.index;option.textContent=tr.name+' / '+clip.name;pick.appendChild(option)}}if([...pick.options].some(o=>o.value===previous))pick.value=previous;previewClip()}
async function refresh(){
 if(running)return;
 let connected=false,compatible=false;
 try{
  const status=await api('/api/status');connected=true;
  compatible=status.protocol===14&&status.can_replace&&Array.isArray(status.actions)&&status.actions.includes('replace');
  if(!compatible)throw new Error('Запусти Clear Silence 0.7.3 для обновления моста и полностью перезапусти Ableton.');
  const r=await api('/api/list');bridgeReady=true;tracks=r.tracks||[];
  selectedTrackIndex=Number.isInteger(r.selected_track_index)?r.selected_track_index:null;
  if(!initialized){mode=tracks.some(x=>x.index===selectedTrackIndex)?'current':'all';customIndices=new Set(tracks.map(x=>x.index));initialized=true}
  else{customIndices=new Set([...customIndices].filter(n=>tracks.some(t=>t.index===n)));if(mode==='current'&&!tracks.some(x=>x.index===selectedTrackIndex))mode='all'}
  drawTracks();updateScope();drawPicker();$('status').className='';$('status').textContent='● Live подключён';
  $('log').className='';$('log').textContent='Выбери дорожки и настрой очистку по волне.';
 }catch(e){
  bridgeReady=false;tracks=[];$('status').className='error';
  $('status').textContent=!connected?'Live не подключён':!compatible?'Требуется новый Bridge':'Ошибка чтения проекта';
  $('log').className='error';$('log').textContent=e.message;drawTracks();updateScope();drawPicker();
 }
}
function formatTime(seconds,precise=false){
 const ms=Math.round(Math.max(0,seconds||0)*1000),whole=Math.floor(ms/1000);
 return Math.floor(whole/60)+':'+String(whole%60).padStart(2,'0')+(precise?'.'+String(ms%1000).padStart(3,'0'):'');
}
function computeKept(profile,strength){if(!profile||!profile.peaks)return[];const opts=settings(),{peaks,hop,rate,first_frame,end_frame}=profile,threshold=Math.pow(10,opts.threshold/20);let first=null,last=null,ranges=[];for(let k=0;k<peaks.length;k++){if(peaks[k]>=threshold){if(first===null)first=k;last=k+1}else if(first!==null&&(k-last+1)*hop*1000/rate>=opts.min_silence_ms){ranges.push([first,last]);first=null;last=null}}if(first!==null)ranges.push([first,last]);const pad=Math.round(rate*opts.padding_ms/1000),active=[];for(const [a,b] of ranges){const left=Math.max(first_frame,first_frame+a*hop-pad),right=Math.min(end_frame,first_frame+b*hop+pad);if(active.length&&left<=active[active.length-1][1])active[active.length-1][1]=Math.max(active[active.length-1][1],right);else active.push([left,right])}return active.map(([a,b])=>[(a-first_frame)/rate,(b-first_frame)/rate])}
// Viewing never changes the analysis settings or the batch selection.
let viewStart=0,viewSpan=0,waveScale=1,waveDrag=null;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function fitWave(){viewStart=0;viewSpan=previewData?previewData.duration:0;drawWave()}
function zoomWave(factor,anchor=.5){
 if(!previewData)return;
 const duration=previewData.duration,at=viewStart+viewSpan*anchor;
 viewSpan=clamp(viewSpan/factor,Math.min(1,duration),duration);
 viewStart=clamp(at-viewSpan*anchor,0,duration-viewSpan);drawWave();
}
function panWave(start){
 if(!previewData)return;
 viewStart=clamp(start,0,previewData.duration-viewSpan);drawWave();
}
function canvasContext(id){
 const canvas=$(id),rect=canvas.getBoundingClientRect(),width=Math.max(1,rect.width),height=rect.height,dpr=window.devicePixelRatio||1;
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
 const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
 return {ctx,width,height};
}
function cutRanges(kept,duration){
 const cuts=[];let cursor=0;
 for(const [a,b] of kept){if(a>cursor)cuts.push([cursor,a]);cursor=b}
 if(cursor<duration)cuts.push([cursor,duration]);return cuts;
}
function paintWave(ctx,width,height,start,span,kept,cuts,overview=false){
 const plotHeight=overview?height:height-20,mid=plotHeight/2;
 ctx.fillStyle='#241d15';ctx.fillRect(0,0,width,height);
 const xAt=t=>(t-start)/span*width;
 for(const [a,b] of cuts){
  const left=clamp(xAt(a),0,width),right=clamp(xAt(b),0,width);
  if(right<=left)continue;
  ctx.fillStyle=overview?'#aa6255':'#733e3b';ctx.fillRect(left,0,right-left,plotHeight);
  if(overview)continue;
  ctx.save();ctx.beginPath();ctx.rect(left,0,right-left,plotHeight);ctx.clip();
  ctx.strokeStyle='#a56158';ctx.lineWidth=1;
  for(let x=left-plotHeight;x<right;x+=10){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+plotHeight,plotHeight);ctx.stroke()}
  ctx.restore();ctx.fillStyle='#f28b79';ctx.fillRect(left,0,right-left,3);
  // True cut boundaries stay distinct even when the waveform is silent.
  for(const t of [a,b]){const x=xAt(t);if(x>0&&x<width)ctx.fillRect(x-.5,0,1,plotHeight)}
 }
 ctx.strokeStyle='#bfa28a';ctx.globalAlpha=.2;ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(width,mid);ctx.stroke();ctx.globalAlpha=1;
 // Max-pool the original 10 ms analysis profile in each visible pixel.
 // Zoom exposes real additional bins, and short peaks are not skipped at 1x.
 const peaks=previewData.peaks,step=previewData.hop/previewData.rate;
 let range=0;
 for(let x=0;x<width;x++){
  const t=start+x/width*span,tEnd=Math.min(start+span,start+(x+1)/width*span);
  const first=clamp(Math.floor(t/step),0,peaks.length-1),end=Math.min(peaks.length,Math.max(first+1,Math.ceil(tEnd/step)));
  let peak=0;for(let j=first;j<end;j++)peak=Math.max(peak,peaks[j]);
  while(range<kept.length&&kept[range][1]<=t)range++;
  const active=range<kept.length&&kept[range][0]<=t;
  const amp=Math.min(1,peak/waveScale)*plotHeight*.39;
  ctx.strokeStyle=active?'#f5bc81':'#ffd0c3';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,mid-amp);ctx.lineTo(x,mid+amp);ctx.stroke();
 }
 if(overview)return;
 ctx.fillStyle='#171310';ctx.fillRect(0,plotHeight,width,height-plotHeight);
 ctx.font='10px -apple-system, sans-serif';ctx.fillStyle='#e5d5c7';
 const precise=span<=10;
 ctx.textAlign='left';ctx.fillText(formatTime(start,precise),6,height-6);
 ctx.textAlign='center';ctx.fillText(formatTime(start+span/2,precise),width/2,height-6);
 ctx.textAlign='right';ctx.fillText(formatTime(start+span,precise),width-6,height-6);ctx.textAlign='left';
}
function drawWave(){
 const main=canvasContext('waveform'),mini=canvasContext('overview');
 const ready=!!previewData,duration=ready?previewData.duration:0,zoomed=ready&&viewSpan<duration-1e-8;
 $('zoomIn').disabled=!ready||viewSpan<=Math.min(1,duration)+1e-8;
 $('zoomOut').disabled=$('zoomFit').disabled=!zoomed;
 const factor=ready?duration/viewSpan:1;$('zoomLevel').textContent=(factor<10?Number(factor.toFixed(1)):Math.round(factor))+'×';
 $('waveform').classList.toggle('zoomed',zoomed);
 const nav=$('overview');nav.setAttribute('aria-valuemax',String(Math.max(0,duration-viewSpan)));nav.setAttribute('aria-valuenow',String(viewStart));nav.setAttribute('aria-disabled',String(!zoomed));
 if(!ready){
  for(const {ctx,width,height} of [main,mini]){ctx.fillStyle='#141210';ctx.fillRect(0,0,width,height)}
  main.ctx.fillStyle='#a99a8b';main.ctx.font='11px -apple-system';main.ctx.textAlign='center';main.ctx.fillText('Здесь появится волна выбранного клипа',main.width/2,main.height/2+4);
  nav.setAttribute('aria-valuetext','Нет клипа');return;
 }
 const kept=computeKept(previewData),cuts=cutRanges(kept,duration);
 paintWave(main.ctx,main.width,main.height,viewStart,viewSpan,kept,cuts);
 paintWave(mini.ctx,mini.width,mini.height,0,duration,kept,cuts,true);
 const left=viewStart/duration*mini.width,right=(viewStart+viewSpan)/duration*mini.width;
 mini.ctx.fillStyle='#100d0bc9';mini.ctx.fillRect(0,0,left,mini.height);mini.ctx.fillRect(right,0,mini.width-right,mini.height);
 mini.ctx.strokeStyle='#ffe4c3';mini.ctx.lineWidth=1.5;mini.ctx.strokeRect(left+.75,.75,Math.max(1,right-left-1.5),mini.height-1.5);
 nav.setAttribute('aria-valuetext',formatTime(viewStart,true)+' — '+formatTime(viewStart+viewSpan,true));
 const keptTime=kept.reduce((n,[a,b])=>n+b-a,0),cutTime=Math.max(0,duration-keptTime);
 $('metrics').textContent=`Весь клип: остаётся ${keptTime.toFixed(2)} с · вырезается ${cutTime.toFixed(2)} с`;
}
async function previewClip(){
 const value=$('clipPick').value,rev=++revision;
 previewData=null;viewStart=0;viewSpan=0;waveDrag=null;drawWave();
 if(!/^\d+:\d+$/.test(value)){$('metrics').textContent='Нет доступного клипа';return}
 const [ti,ci]=value.split(':').map(Number);$('metrics').textContent='Загружаю осциллограмму…';
 try{
  const p=await api('/api/clip/profile',{track_index:ti,clip_index:ci});if(rev!==revision)return;
  previewData=p;viewSpan=p.duration;
  const sorted=[...p.peaks].sort((a,b)=>a-b);waveScale=Math.max(.03,sorted[Math.floor(sorted.length*.96)]||1);
  drawWave();
 }catch(e){if(rev!==revision)return;$('metrics').textContent='Нет предпросмотра: '+e.message}
}
for(const id of ['waveform','overview']){
 const canvas=$(id),isOverview=id==='overview';
 canvas.addEventListener('pointerdown',e=>{
  if(!previewData||e.button!==0||viewSpan>=previewData.duration)return;
  const rect=canvas.getBoundingClientRect(),ratio=clamp((e.clientX-rect.left)/rect.width,0,1);
  if(isOverview){
   const at=ratio*previewData.duration;
   if(at<viewStart||at>viewStart+viewSpan)panWave(at-viewSpan/2);
  }
  waveDrag={id,pointer:e.pointerId,x:e.clientX,start:viewStart,width:rect.width,span:viewSpan};
  canvas.setPointerCapture(e.pointerId);canvas.focus();canvas.classList.add('dragging');e.preventDefault();
 });
 canvas.addEventListener('pointermove',e=>{
  if(!waveDrag||waveDrag.id!==id||waveDrag.pointer!==e.pointerId)return;
  const scale=isOverview?previewData.duration:-waveDrag.span;
  panWave(waveDrag.start+(e.clientX-waveDrag.x)/waveDrag.width*scale);
 });
 const endDrag=()=>{waveDrag=null;canvas.classList.remove('dragging')};
 canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);canvas.addEventListener('lostpointercapture',endDrag);
 canvas.addEventListener('dblclick',fitWave);
 canvas.addEventListener('keydown',e=>{
  if(!previewData)return;
  if(e.key==='+'||e.key==='=')zoomWave(2);
  else if(e.key==='-')zoomWave(.5);
  else if(e.key==='0')fitWave();
  else if(e.key==='ArrowLeft')panWave(viewStart-viewSpan*.2);
  else if(e.key==='ArrowRight')panWave(viewStart+viewSpan*.2);
  else if(e.key==='Home')panWave(0);
  else if(e.key==='End')panWave(previewData.duration-viewSpan);
  else return;e.preventDefault();
 });
}
$('waveform').addEventListener('wheel',e=>{
 if(!previewData)return;
 if(e.ctrlKey||e.metaKey){e.preventDefault();const rect=e.currentTarget.getBoundingClientRect();zoomWave(Math.exp(-clamp(e.deltaY,-100,100)*.01),clamp((e.clientX-rect.left)/rect.width,0,1))}
 else if(viewSpan<previewData.duration){e.preventDefault();panWave(viewStart+(e.deltaX||e.deltaY)/e.currentTarget.clientWidth*viewSpan)}
},{passive:false});
$('strength').addEventListener('input',()=>{$('level').textContent=$('strength').value+'%';drawWave()});window.addEventListener('resize',drawWave);
async function runStrip(){
 if(running||!bridgeReady)return;
 const chosen=ids();
 if(!chosen.length){$('log').textContent='Выбери аудиодорожку.';return}
 running=true;updateScope();$('log').className='';
 $('log').textContent='Анализирую тишину…';
 try{
  const p=await api('/api/batch/analyze',
    {track_indices:chosen,strength:Number($('strength').value),backup_originals:$('backup').checked});
  const job=await api('/api/batch/start',{plan_id:p.plan_id});
  if(job.done){$('log').textContent=job.message+(p.skipped_count?' Пропущено неподдерживаемых: '+p.skipped_count:'');return}
  activeJob=job.job_id;
  for(;;){
   await new Promise(resolve=>setTimeout(resolve,430));
   const r=await api('/api/batch/status?id='+encodeURIComponent(activeJob));
   $('log').textContent=r.message+'\n'+r.completed+'/'+r.total+' клипов';
   if(r.state!=='running'){
    if(r.state==='error'){
      $('log').className='error';
      $('log').textContent=r.message;
    }else $('log').textContent=r.message;
    if(p.skipped_count)$('log').textContent+='\nПропущено неподдерживаемых: '+p.skipped_count;
    break;
   }
  }
 }catch(e){$('log').className='error';$('log').textContent='Обработка остановлена: '+e.message}
 finally{activeJob=null;running=false;updateScope()}
}
async function cancelStrip(){
 if(!activeJob)return;
 try{
  await api('/api/batch/cancel',{job_id:activeJob});
  $('log').textContent='Останавливаю после текущего клипа…';
 }catch(e){$('log').textContent=e.message}
}
async function quitApp(){if(running){alert('Сначала заверши обработку.');return}try{await api('/api/shutdown',{});if(window.pywebview&&window.pywebview.api)await window.pywebview.api.close()}catch(e){$('log').textContent=e.message}}
refresh();drawWave();
</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clear Silence 0.7.0</title>
<style>
:root{color-scheme:dark;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#151412;color:#f1ece6;--accent:#ed985b;--keep:#f5bc81;--cut:#a49bb2;--edge:#38332e;--muted:#afa69b}
*{box-sizing:border-box}body{margin:0;padding:12px;width:100%;min-width:388px}button,select,input{font:inherit}button{border-radius:8px;background:#302b26;border:1px solid #4b4239;color:#e9e1d8;padding:7px 10px;cursor:pointer;transition:background .12s}button:hover:not(:disabled){background:#41372e}button:disabled{opacity:.42;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.title{display:flex;gap:10px;align-items:center;margin:0 0 12px}.symbol{display:grid;place-items:center;width:36px;height:36px;background:#27221c;border:1px solid #4b3624;border-radius:10px;color:var(--accent);flex-shrink:0}.title strong{font-size:17px;font-weight:650;letter-spacing:-.3px}.title small{display:block;color:var(--muted);font-size:10px;margin-top:1px}#status{margin-left:auto;text-align:right;color:#c7bcaf;max-width:132px;font-size:10px}#status.error{color:#f8ac98}
.card{background:#201d1a;border:1px solid var(--edge);border-radius:12px;margin:0 0 8px;padding:10px}.hrow{display:flex;align-items:center;justify-content:space-between;gap:9px}.label{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--muted)}.refresh{border:0;background:none;padding:0 3px;font-size:19px;line-height:20px;color:#c1b3a5}.toggle{display:flex;gap:3px;background:#171513;border:1px solid #38312b;border-radius:8px;padding:3px;margin-top:8px}.toggle button{flex:1;border:0;background:transparent;font-size:11px;padding:5px 5px;border-radius:5px;color:#b8aea3}.toggle button.active{background:#463122;color:#ffcd9b;font-weight:650}.scope{margin:6px 0 0;color:#d5cbbf;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scope.warn{color:#f8ac98}#customPanel{display:none;max-height:105px;overflow:auto;padding:6px 1px;border-top:1px solid var(--edge);margin-top:8px}#customPanel.open{display:block}.track{display:flex;align-items:center;gap:7px;font-size:11px;padding:5px 3px}.track span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track small{color:var(--muted)}input[type=checkbox]{accent-color:var(--accent)}select{width:100%;min-width:0;margin:9px 0 8px;border-radius:7px;border:1px solid #453c33;background:#191613;color:#e9e1d8;padding:7px;font-size:11px}.wave{background:#141210;border:1px solid #463b30;border-radius:7px;overflow:hidden}#waveform{display:block;height:110px;width:100%}.legend{display:flex;justify-content:space-between;gap:10px;color:#ded3c7;font-size:11px;margin-top:8px}.swatch{display:inline-block;vertical-align:-2px;width:12px;height:12px;border-radius:3px;margin-right:6px;background:var(--keep)}.swatch.cut{background:repeating-linear-gradient(135deg,#a49bb2 0 2px,#3b3543 2px 5px);border:1px solid #a49bb2}#metrics{color:var(--muted);font-size:10px;margin-top:5px;min-height:15px;font-variant-numeric:tabular-nums}
.strength{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.strength strong{font-size:24px;font-weight:550;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--accent)}#strength{width:100%;accent-color:var(--accent);margin:7px 0 2px;height:18px}.hints{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.backup{display:flex;align-items:center;gap:7px;font-size:11px;margin:9px 0 0;padding-top:8px;border-top:1px solid var(--edge);color:#d2c7bb}.backup input{margin:0;width:14px;height:14px}.primary{width:100%;min-height:42px;background:var(--accent);border-color:var(--accent);color:#26190f;font-weight:700;font-size:13px;margin-top:9px}.primary:hover:not(:disabled){background:#ffae70}.primary:disabled{opacity:.45}#log{color:#bfb2a5;font-size:10.5px;white-space:pre-wrap;margin-top:7px;min-height:16px;max-height:65px;overflow-y:auto;overflow-wrap:anywhere}#log.error{color:#ffb29b}.foot{color:#a99a8b;font-size:10px;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:1px 2px 0}.link{background:none;padding:0;border:0;color:#c2b3a4;font-size:10px}
</style></head><body>
<header class="title"><span class="symbol" aria-hidden="true"><svg width="25" height="22" viewBox="0 0 25 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M2 9v4M6 5v12M10 8v6M16 5v12M20 2v18M24 8v6"/></svg></span><span><strong>Clear Silence</strong><small>Очистка пауз · v0.7.0</small></span><span id="status">Подключение…</span></header>
<section class="card"><div class="hrow"><span class="label">ОБЛАСТЬ</span><button class="refresh" onclick="refresh()" title="Обновить проект" aria-label="Обновить проект">↻</button></div><div class="toggle"><button data-mode="current" onclick="setMode('current')">Дорожка</button><button data-mode="all" onclick="setMode('all')">Все</button><button data-mode="custom" onclick="setMode('custom')">Выбрать…</button></div><div class="scope" id="scopeLabel">Читаю Arrangement…</div><div id="customPanel"></div></section>
<section class="card"><div class="hrow"><span class="label">ПРЕДПРОСМОТР</span><span style="font-size:10px;color:var(--muted)">Без изменений проекта</span></div><select id="clipPick" aria-label="Клип для просмотра" onchange="previewClip()"><option>Поиск клипов…</option></select><div class="wave"><canvas id="waveform" aria-label="Янтарным — остаётся, серо-лиловой штриховкой — вырезается"></canvas></div><div class="legend"><span><i class="swatch"></i>Остаётся</span><span><i class="swatch cut"></i>Вырезается</span></div><div id="metrics">Выбери клип</div></section>
<section class="card"><div class="strength"><span class="label">СТЕПЕНЬ ОЧИСТКИ</span><strong id="level">50%</strong></div><input id="strength" aria-label="Мягче или жёстче" type="range" min="0" max="100" step="1" value="50"><div class="hints"><span>Мягче</span><span>Сильнее</span></div><label class="backup" title="Полная аудиокопия каждого обрабатываемого клипа до очистки, без пересчёта сэмплов"><input id="backup" type="checkbox" checked>Сохранить оригиналы в Take Lanes</label><button id="probe" class="primary" onclick="runStrip()" disabled>Убрать тишину</button>
<button id="cancel" onclick="cancelStrip()" style="display:none;width:100%;margin-top:8px">Остановить обработку</button><div id="log">Исходные WAV остаются целыми.</div></section>
<div class="foot"><span>WAV · Warp OFF · Live 12.4.6</span><button class="link" onclick="quitApp()">Закрыть</button></div>
<script>
const $=id=>document.getElementById(id);
let activeJob=null,tracks=[],mode='auto',selectedTrackIndex=null,customIndices=new Set(),initialized=false,running=false,bridgeReady=false,previewData=null,revision=0,job=null;
const settings=()=>{const t=Number($('strength').value)/100;return{strength:Number($('strength').value),threshold:Math.round((-62+37*t)*100)/100,min_silence_ms:Math.round(320-230*t),padding_ms:Math.round(75-60*t)}};
async function api(path,payload){const cfg=payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-ClearSilence-Token':'__CSRF__'},body:JSON.stringify(payload)};const res=await fetch(path,cfg);const data=await res.json();if(!data.ok)throw new Error(data.error||'Ошибка подключения');return data}
function ids(){if(mode==='all')return tracks.map(x=>x.index);if(mode==='current')return tracks.some(x=>x.index===selectedTrackIndex)?[selectedTrackIndex]:[];return tracks.filter(x=>customIndices.has(x.index)).map(x=>x.index)}
function updateScope(){document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));$('customPanel').classList.toggle('open',mode==='custom');const selected=ids(),matches=tracks.filter(x=>selected.includes(x.index)),total=matches.reduce((sum,x)=>sum+x.clips.length,0);const label=$('scopeLabel');label.classList.toggle('warn',!total);if(mode==='current')label.textContent=matches.length?`${matches[0].name} · ${total} клип.`:'Выбери аудиодорожку в Ableton';else label.textContent=`${selected.length} дор. · ${total} аудиоклип.`;$('probe').disabled=!bridgeReady||!selected.length||running;$('cancel').style.display=running?'block':'none';document.querySelectorAll('select,input,[data-mode],.refresh').forEach(el=>el.disabled=running)}
function drawTracks(){const root=$('customPanel');root.replaceChildren();for(const tr of tracks){const lab=document.createElement('label');lab.className='track';const cb=document.createElement('input');cb.type='checkbox';cb.checked=customIndices.has(tr.index);cb.onchange=()=>{cb.checked?customIndices.add(tr.index):customIndices.delete(tr.index);updateScope();drawPicker()};const sp=document.createElement('span');sp.textContent=tr.name;const note=document.createElement('small');note.textContent=tr.clips.length+' кл.';lab.append(cb,sp,note);root.appendChild(lab)}}
function setMode(v){if(running)return;mode=v;updateScope();drawPicker()}
function drawPicker(){const pick=$('clipPick'),previous=pick.value;pick.replaceChildren();for(const tr of tracks){if(!ids().includes(tr.index))continue;for(const clip of tr.clips){const option=document.createElement('option');option.value=tr.index+':'+clip.index;option.textContent=tr.name+' / '+clip.name;pick.appendChild(option)}}if([...pick.options].some(o=>o.value===previous))pick.value=previous;previewClip()}
async function refresh(){if(running)return;try{const s=await api('/api/status');bridgeReady=s.protocol===12&&s.can_replace&&Array.isArray(s.actions)&&s.actions.includes('replace');const r=await api('/api/list');tracks=r.tracks||[];selectedTrackIndex=Number.isInteger(r.selected_track_index)?r.selected_track_index:null;if(!initialized){mode=tracks.some(x=>x.index===selectedTrackIndex)?'current':'all';customIndices=new Set(tracks.map(x=>x.index));initialized=true}else{customIndices=new Set([...customIndices].filter(n=>tracks.some(t=>t.index===n)));if(mode==='current'&&!tracks.some(x=>x.index===selectedTrackIndex))mode='all'}drawTracks();updateScope();drawPicker();$('status').className=bridgeReady?'':'error';$('status').textContent=bridgeReady?'● Live подключён':'Требуется новый Bridge';$('log').className='';$('log').textContent=bridgeReady?'Выбери дорожки и настрой очистку по волне.':'Установи v0.7.0 и полностью перезапусти Ableton (старый скрипт отключён).'}catch(e){bridgeReady=false;tracks=[];$('status').className='error';$('status').textContent='Live не подключён';$('log').className='error';$('log').textContent=e.message;updateScope();drawPicker()}}
function formatTime(seconds){seconds=Math.max(0,seconds||0);return Math.floor(seconds/60)+':'+('0'+Math.floor(seconds%60)).slice(-2)}
function computeKept(profile,strength){if(!profile||!profile.peaks)return[];const opts=settings(),{peaks,hop,rate,first_frame,end_frame}=profile,threshold=Math.pow(10,opts.threshold/20);let first=null,last=null,ranges=[];for(let k=0;k<peaks.length;k++){if(peaks[k]>=threshold){if(first===null)first=k;last=k+1}else if(first!==null&&(k-last+1)*hop*1000/rate>=opts.min_silence_ms){ranges.push([first,last]);first=null;last=null}}if(first!==null)ranges.push([first,last]);const pad=Math.round(rate*opts.padding_ms/1000),active=[];for(const [a,b] of ranges){const left=Math.max(first_frame,first_frame+a*hop-pad),right=Math.min(end_frame,first_frame+b*hop+pad);if(active.length&&left<=active[active.length-1][1])active[active.length-1][1]=Math.max(active[active.length-1][1],right);else active.push([left,right])}return active.map(([a,b])=>[(a-first_frame)/rate,(b-first_frame)/rate])}
function drawWave(){
 const cvs=$('waveform'),width=Math.max(50,cvs.getBoundingClientRect().width),height=110,dpr=window.devicePixelRatio||1;
 cvs.width=Math.round(width*dpr);cvs.height=Math.round(height*dpr);const ctx=cvs.getContext('2d');ctx.scale(dpr,dpr);ctx.fillStyle='#141210';ctx.fillRect(0,0,width,height);
 if(!previewData){ctx.fillStyle='#a99a8b';ctx.font='11px -apple-system';ctx.textAlign='center';ctx.fillText('Здесь появится волна выбранного клипа',width/2,height/2+4);return}
 const duration=previewData.duration||1,kept=computeKept(previewData),wave=previewData.waveform||[];
 // Hatching also distinguishes silence at tiny amplitude and without colour.
 const gap=(left,right)=>{if(right<=left)return;ctx.save();ctx.beginPath();ctx.rect(left,0,right-left,height);ctx.clip();ctx.fillStyle='#302a37';ctx.fillRect(left,0,right-left,height);ctx.strokeStyle='#51465c';ctx.lineWidth=1;for(let x=left-height;x<right;x+=9){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+height,height);ctx.stroke()}ctx.restore()};
 let cursor=0;for(const [a,b] of kept){const x1=a/duration*width,x2=b/duration*width;gap(cursor,x1);ctx.fillStyle='#2b2118';ctx.fillRect(x1,0,x2-x1,height);ctx.fillStyle='#d89456';ctx.fillRect(x1,0,Math.max(1,x2-x1),2);cursor=x2}gap(cursor,width);
 ctx.strokeStyle='#76685d';ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(0,height/2);ctx.lineTo(width,height/2);ctx.stroke();ctx.globalAlpha=1;
 const sorted=[...wave].sort((a,b)=>a-b),scale=Math.max(.03,sorted[Math.floor(sorted.length*.96)]||1);
 for(let x=0;x<width;x++){const j=Math.min(wave.length-1,Math.floor(x/width*wave.length));if(j<0)break;const time=x/width*duration,active=kept.some(([a,b])=>time>=a&&time<=b),amp=Math.min(1,(wave[j]||0)/scale)*height*.37;ctx.strokeStyle=active?'#f5bc81':'#b2a8bf';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,height/2-amp);ctx.lineTo(x,height/2+amp);ctx.stroke()}
 ctx.font='10px -apple-system';ctx.fillStyle='#dfd4c8';ctx.fillText('0:00',7,height-7);ctx.textAlign='right';ctx.fillText(formatTime(duration),width-7,height-7);ctx.textAlign='left';
 const keptTime=kept.reduce((n,[a,b])=>n+b-a,0),cutTime=Math.max(0,duration-keptTime);$('metrics').textContent=`Остаётся ${keptTime.toFixed(2)} с  ·  Вырезается ${cutTime.toFixed(2)} с`;
}
async function previewClip(){const value=$('clipPick').value,rev=++revision;if(!/^\d+:\d+$/.test(value)){previewData=null;drawWave();$('metrics').textContent='Нет доступного клипа';return}const [ti,ci]=value.split(':').map(Number);$('metrics').textContent='Загружаю осциллограмму…';try{const p=await api('/api/clip/profile',{track_index:ti,clip_index:ci});if(rev!==revision)return;previewData=p;drawWave()}catch(e){if(rev!==revision)return;previewData=null;drawWave();$('metrics').textContent='Нет предпросмотра: '+e.message}}
$('strength').addEventListener('input',()=>{$('level').textContent=$('strength').value+'%';drawWave()});window.addEventListener('resize',drawWave);
async function runStrip(){
 if(running||!bridgeReady)return;
 const chosen=ids();
 if(!chosen.length){$('log').textContent='Выбери аудиодорожку.';return}
 running=true;updateScope();$('log').className='';
 $('log').textContent='Анализирую тишину…';
 try{
  const p=await api('/api/batch/analyze',
    {track_indices:chosen,strength:Number($('strength').value),backup_originals:$('backup').checked});
  const job=await api('/api/batch/start',{plan_id:p.plan_id});
  if(job.done){$('log').textContent=job.message+(p.skipped_count?' Пропущено неподдерживаемых: '+p.skipped_count:'');return}
  activeJob=job.job_id;
  for(;;){
   await new Promise(resolve=>setTimeout(resolve,430));
   const r=await api('/api/batch/status?id='+encodeURIComponent(activeJob));
   $('log').textContent=r.message+'\n'+r.completed+'/'+r.total+' клипов';
   if(r.state!=='running'){
    if(r.state==='error'){
      $('log').className='error';
      $('log').textContent=r.message;
    }else $('log').textContent=r.message;
    if(p.skipped_count)$('log').textContent+='\nПропущено неподдерживаемых: '+p.skipped_count;
    break;
   }
  }
 }catch(e){$('log').className='error';$('log').textContent='Обработка остановлена: '+e.message}
 finally{activeJob=null;running=false;updateScope()}
}
async function cancelStrip(){
 if(!activeJob)return;
 try{
  await api('/api/batch/cancel',{job_id:activeJob});
  $('log').textContent='Останавливаю после текущего клипа…';
 }catch(e){$('log').textContent=e.message}
}
async function quitApp(){if(running){alert('Сначала заверши обработку.');return}try{await api('/api/shutdown',{});if(window.pywebview&&window.pywebview.api)await window.pywebview.api.close()}catch(e){$('log').textContent=e.message}}
refresh();drawWave();
</script></body></html>
